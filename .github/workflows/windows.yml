name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI · Testy a kontrola verzie
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Zdrojový kód
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Závislosti
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Tlačový komponent
        run: dotnet build windows_print/WindowsPrint.csproj -c Release -p:Platform=x64
      - name: Automatické testy
        run: python -m unittest discover -v
      - name: Verzia a release tag
        run: python scripts/build_windows.py --validate
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  build:
    name: Build · Windows balíky
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Zdrojový kód
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Závislosti
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Prenosná aplikácia a inštalátor
        run: python scripts/build_windows.py
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Overenie inštalácie a aktualizácie
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
      - name: Uloženie balíkov
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmniPDF-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: CD · GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Stiahnutie zostavených balíkov
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OmniPDF-windows-x64
          path: release
      - name: Zverejnenie vydania
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create $env:TAG @assets --verify-tag --title "Omni PDF" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases and assets are never overwritten.' }
