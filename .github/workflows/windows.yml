name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Prepare Windows OCR
        shell: powershell
        run: ./scripts/ensure_windows_ocr.ps1
      - run: python -m unittest discover -v
        env:
          RUN_WINDOWS_OCR: '1'
      - run: python scripts/build_windows.py --validate
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python scripts/build_windows.py
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Prepare Windows OCR
        shell: powershell
        run: ./scripts/ensure_windows_ocr.ps1
      - name: Smoke test portable and installed application
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OmniPDF-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OmniPDF-windows-x64
          path: release
      - name: Publish new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create $env:TAG @assets --verify-tag --title "Omni PDF" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases and assets are never overwritten.' }
